name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the release to (only used for manual runs)"
        required: true

# Add a `build-windows` job here once the Windows app exists, then list it
# alongside `build-macos` in the `release` job's `needs:`.
jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app bundle
        run: mac/Scripts/build_app.sh

      - name: Zip app bundle
        run: |
          cd mac/build
          ditto -c -k --sequesterRsrc --keepParent MonitorInputSwitcher.app MonitorInputSwitcher-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: mac/build/MonitorInputSwitcher-macOS.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*.zip
